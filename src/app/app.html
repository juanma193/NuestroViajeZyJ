<main class="min-h-screen bg-gray-50">
  <header *ngIf="mostrarNavbar" class="bg-gradient-to-r from-pink-200 to-yellow-200">
    <div class="max-w-6xl mx-auto px-4">
      <div class="flex items-center justify-between py-6">
        <div>
          <h1 class="text-2xl text-pink-400 font-extrabold">{{ title }}</h1>
          <p class="text-sm text-gray-600">Nuestros recuerdos y planes juntos</p>
        </div>

        <button
          class="lg:hidden inline-flex items-center justify-center rounded-md p-2 text-pink-600 hover:bg-white/40"
          (click)="toggleMenu()"
          aria-label="Abrir menú">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>

        <nav class="hidden lg:flex gap-3">
          <a routerLink="/inicio" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="px-3 py-2 rounded-md hover:bg-white/40">🏠 Inicio</a>
          <a routerLink="/viajes" routerLinkActive="active" class="px-3 py-2 rounded-md hover:bg-white/40">🌍 Viajes</a>
          <a routerLink="/calendario" routerLinkActive="active" class="px-3 py-2 rounded-md hover:bg-white/40">📅 Calendario</a>
          <a routerLink="/cosas-hacer" routerLinkActive="active" class="px-3 py-2 rounded-md hover:bg-white/40">✅ Cosas por Hacer</a>
          <a routerLink="/lugares" routerLinkActive="active" class="px-3 py-2 rounded-md hover:bg-white/40">📍 Lugares</a>
          <a routerLink="/peliculas" routerLinkActive="active" class="px-3 py-2 rounded-md hover:bg-white/40">🎬 Películas/Series</a>
          <a *ngIf="isAuthed" routerLink="/perfil" routerLinkActive="active" class="px-3 py-2 rounded-md hover:bg-white/40">👤 Perfil</a>
          <a *ngIf="!isAuthed" routerLink="/login" routerLinkActive="active" class="px-3 py-2 rounded-md hover:bg-white/40">🔐 Iniciar sesión</a>
          <button *ngIf="isAuthed" class="px-3 py-2 rounded-md hover:bg-white/40" (click)="logout()">🚪 Salir</button>
        </nav>
      </div>

      <div *ngIf="menuOpen" class="lg:hidden pb-4">
        <nav class="flex flex-col gap-2 bg-white/60 rounded-lg p-3">
          <a (click)="closeMenu()" routerLink="/inicio" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="px-3 py-2 rounded-md hover:bg-white/40">🏠 Inicio</a>
          <a (click)="closeMenu()" routerLink="/viajes" routerLinkActive="active" class="px-3 py-2 rounded-md hover:bg-white/40">🌍 Viajes</a>
          <a (click)="closeMenu()" routerLink="/calendario" routerLinkActive="active" class="px-3 py-2 rounded-md hover:bg-white/40">📅 Calendario</a>
          <a (click)="closeMenu()" routerLink="/cosas-hacer" routerLinkActive="active" class="px-3 py-2 rounded-md hover:bg-white/40">✅ Cosas por Hacer</a>
          <a (click)="closeMenu()" routerLink="/lugares" routerLinkActive="active" class="px-3 py-2 rounded-md hover:bg-white/40">📍 Lugares</a>
          <a (click)="closeMenu()" routerLink="/peliculas" routerLinkActive="active" class="px-3 py-2 rounded-md hover:bg-white/40">🎬 Películas/Series</a>
          <a *ngIf="isAuthed" (click)="closeMenu()" routerLink="/perfil" routerLinkActive="active" class="px-3 py-2 rounded-md hover:bg-white/40">👤 Perfil</a>
          <a *ngIf="!isAuthed" (click)="closeMenu()" routerLink="/login" routerLinkActive="active" class="px-3 py-2 rounded-md hover:bg-white/40">🔐 Iniciar sesión</a>
          <button *ngIf="isAuthed" class="px-3 py-2 rounded-md hover:bg-white/40 text-left" (click)="logout()">🚪 Salir</button>
        </nav>
      </div>
    </div>
  </header>

  <router-outlet></router-outlet>
  <app-toast-container></app-toast-container>
</main>
