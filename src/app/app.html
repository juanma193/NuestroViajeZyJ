<main class="min-h-screen bg-gray-50">
  <header class="bg-gradient-to-r from-pink-200 to-yellow-200">
    <div class="max-w-6xl mx-auto px-4">
      <div class="flex items-center justify-between py-6">
        <div>
          <h1 class="text-2xl text-pink-400 font-extrabold">{{ title }}</h1>
          <p class="text-sm text-gray-600">Nuestros recuerdos y planes juntos</p>
        </div>

        <nav class="flex gap-3">
          <a routerLink="/inicio" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="px-3 py-2 rounded-md hover:bg-white/40">🏠 Inicio</a>
          <a routerLink="/viajes" routerLinkActive="active" class="px-3 py-2 rounded-md hover:bg-white/40">🌍 Viajes</a>
          <a routerLink="/calendario" routerLinkActive="active" class="px-3 py-2 rounded-md hover:bg-white/40">📅 Calendario</a>
          <a routerLink="/cosas-hacer" routerLinkActive="active" class="px-3 py-2 rounded-md hover:bg-white/40">✅ Cosas por Hacer</a>
          <a routerLink="/lugares" routerLinkActive="active" class="px-3 py-2 rounded-md hover:bg-white/40">📍 Lugares</a>
          <a routerLink="/peliculas" routerLinkActive="active" class="px-3 py-2 rounded-md hover:bg-white/40">🎬 Películas/Series</a>
        </nav>
      </div>
    </div>
  </header>

  <router-outlet></router-outlet>
  <app-toast-container></app-toast-container>
</main>
