<main class="min-h-screen bg-gradient-to-b from-pink-100 via-rose-50 to-amber-100">
  <!-- HEADER -->
  <header *ngIf="mostrarNavbar" class="sticky top-0 z-50">
    <!-- Barra superior (paleta + blur) -->
    <div
      class="bg-gradient-to-r from-pink-200/80 via-rose-100/80 to-yellow-200/80 backdrop-blur-xl border-b border-white/50 shadow-sm"
    >
      <div class="max-w-6xl mx-auto px-4">
        <div class="flex items-center justify-between py-4">
          <!-- Brand (logo más grande) -->
          <a routerLink="/inicio" class="flex items-center gap-4">
            <div class="relative">
              <img
                src="/assets/logo-pagina.png"
                alt="Logo Nuestro Viaje"
                class="w-14 h-14 sm:w-16 sm:h-16 rounded-3xl object-cover shadow-lg ring-1 ring-white/70"
              />
            </div>

            <div class="leading-tight">
              <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight text-gray-900 font-title">
                <span class="bg-gradient-to-r from-pink-500 to-rose-500 bg-clip-text text-transparent">
                  {{ title }}
                </span>
              </h1>
              <p class="text-sm text-gray-700/80 font-semibold">
                Nuestros recuerdos y planes juntos
              </p>
            </div>
          </a>

          <!-- Solo hamburguesa (siempre) -->
          <button
            class="inline-flex items-center justify-center rounded-2xl p-3 text-gray-900 hover:bg-white/40 transition ring-1 ring-white/60 shadow-sm"
            (click)="toggleMenu()"
            aria-label="Abrir menú"
            type="button"
          >
            <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- MOBILE DRAWER (menú lateral) -->
    <div *ngIf="menuOpen" class="fixed inset-0 z-50">
      <!-- overlay -->
      <button
        class="absolute inset-0 bg-black/35"
        (click)="closeMenu()"
        aria-label="Cerrar menú"
        type="button"
      ></button>

      <!-- panel -->
      <div
        class="absolute right-0 top-0 h-full w-[88%] max-w-sm bg-gradient-to-b from-pink-100/85 via-rose-50/85 to-amber-100/85 backdrop-blur-xl border-l border-white/60 shadow-2xl"
      >
        <div class="p-4 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <img
              src="/assets/logo-pagina.png"
              alt="Logo"
              class="w-12 h-12 rounded-3xl object-cover shadow-md ring-1 ring-white/70"
            />
            <div class="leading-tight">
              <div class="text-base font-extrabold text-gray-900 font-title">{{ title }}</div>
              <div class="text-xs font-semibold text-gray-700/80">Todo en un solo lugar</div>
            </div>
          </div>

          <button
            class="rounded-2xl p-2.5 hover:bg-white/50 transition ring-1 ring-white/60 shadow-sm"
            (click)="closeMenu()"
            aria-label="Cerrar"
            type="button"
          >
            ✕
          </button>
        </div>

        <nav class="px-4 pb-6">
          <div class="space-y-2">
            <a
              (click)="closeMenu()"
              routerLink="/inicio"
              [routerLinkActiveOptions]="{ exact: true }"
              routerLinkActive="bg-white/55 shadow-md ring-1 ring-white/70 text-gray-900"
              class="flex items-center justify-between px-3 py-3 rounded-2xl text-sm font-extrabold text-gray-800 bg-white/20 hover:bg-white/35 transition"
            >
              <span class="flex items-center gap-2">🏠 <span>Inicio</span></span>
              <span class="text-gray-500">›</span>
            </a>

            <a
              (click)="closeMenu()"
              routerLink="/viajes"
              routerLinkActive="bg-white/55 shadow-md ring-1 ring-white/70 text-gray-900"
              class="flex items-center justify-between px-3 py-3 rounded-2xl text-sm font-extrabold text-gray-800 bg-white/20 hover:bg-white/35 transition"
            >
              <span class="flex items-center gap-2">🌍 <span>Viajes</span></span>
              <span class="text-gray-500">›</span>
            </a>

            <a
              (click)="closeMenu()"
              routerLink="/calendario"
              routerLinkActive="bg-white/55 shadow-md ring-1 ring-white/70 text-gray-900"
              class="flex items-center justify-between px-3 py-3 rounded-2xl text-sm font-extrabold text-gray-800 bg-white/20 hover:bg-white/35 transition"
            >
              <span class="flex items-center gap-2">📅 <span>Calendario</span></span>
              <span class="text-gray-500">›</span>
            </a>

            <a
              (click)="closeMenu()"
              routerLink="/cosas-hacer"
              routerLinkActive="bg-white/55 shadow-md ring-1 ring-white/70 text-gray-900"
              class="flex items-center justify-between px-3 py-3 rounded-2xl text-sm font-extrabold text-gray-800 bg-white/20 hover:bg-white/35 transition"
            >
              <span class="flex items-center gap-2">✅ <span>Cosas por Hacer</span></span>
              <span class="text-gray-500">›</span>
            </a>

            <a
              (click)="closeMenu()"
              routerLink="/lugares"
              routerLinkActive="bg-white/55 shadow-md ring-1 ring-white/70 text-gray-900"
              class="flex items-center justify-between px-3 py-3 rounded-2xl text-sm font-extrabold text-gray-800 bg-white/20 hover:bg-white/35 transition"
            >
              <span class="flex items-center gap-2">📍 <span>Lugares</span></span>
              <span class="text-gray-500">›</span>
            </a>

            <a
              (click)="closeMenu()"
              routerLink="/peliculas"
              routerLinkActive="bg-white/55 shadow-md ring-1 ring-white/70 text-gray-900"
              class="flex items-center justify-between px-3 py-3 rounded-2xl text-sm font-extrabold text-gray-800 bg-white/20 hover:bg-white/35 transition"
            >
              <span class="flex items-center gap-2">🎬 <span>Películas/Series</span></span>
              <span class="text-gray-500">›</span>
            </a>

            <div class="pt-3 space-y-2">
              <a
                *ngIf="isAuthed"
                (click)="closeMenu()"
                routerLink="/perfil"
                routerLinkActive="bg-white/55 shadow-md ring-1 ring-white/70 text-gray-900"
                class="flex items-center justify-between px-3 py-3 rounded-2xl text-sm font-extrabold text-gray-800 bg-white/20 hover:bg-white/35 transition"
              >
                <span class="flex items-center gap-2">👤 <span>Perfil</span></span>
                <span class="text-gray-500">›</span>
              </a>

              <a
                *ngIf="!isAuthed"
                (click)="closeMenu()"
                routerLink="/login"
                routerLinkActive="bg-white/55 shadow-md ring-1 ring-white/70 text-gray-900"
                class="flex items-center justify-between px-3 py-3 rounded-2xl text-sm font-extrabold text-gray-800 bg-white/20 hover:bg-white/35 transition"
              >
                <span class="flex items-center gap-2">🔐 <span>Iniciar sesión</span></span>
                <span class="text-gray-500">›</span>
              </a>

              <button
                *ngIf="isAuthed"
                class="w-full px-3 py-3 rounded-2xl text-sm font-extrabold text-white bg-gradient-to-r from-pink-500 to-rose-500 shadow-md hover:opacity-95 transition text-left"
                (click)="logout()"
                type="button"
              >
                🚪 Salir
              </button>
            </div>
          </div>
        </nav>
      </div>
    </div>
  </header>

  <!-- Contenido -->
  <router-outlet></router-outlet>
  <app-toast-container></app-toast-container>
</main>
