<div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4" (click)="onCerrar()">
  <div class="bg-white w-full max-w-lg rounded-xl shadow-2xl overflow-hidden" (click)="$event.stopPropagation()">
    <div class="flex items-center justify-between px-6 py-4 border-b">
      <h2 class="text-xl font-bold">✈️ Nuevo Viaje</h2>
      <button class="text-gray-500 hover:text-gray-700" (click)="onCerrar()">✕</button>
    </div>

    <div class="p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Nombre *</label>
        <input type="text" [(ngModel)]="viaje.nombre" placeholder="Ej: Viaje a París" class="mt-1 block w-full rounded-md border-gray-200 shadow-sm px-3 py-2" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Descripción</label>
        <textarea [(ngModel)]="viaje.descripcion" rows="3" class="mt-1 block w-full rounded-md border-gray-200 shadow-sm px-3 py-2"></textarea>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Fecha desde</label>
          <input type="date" [(ngModel)]="viaje.fecha_desde" class="mt-1 block w-full rounded-md border-gray-200 shadow-sm px-3 py-2" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Fecha hasta</label>
          <input type="date" [(ngModel)]="viaje.fecha_hasta" class="mt-1 block w-full rounded-md border-gray-200 shadow-sm px-3 py-2" />
        </div>
      </div>

      <div>
        <label class="inline-flex items-center gap-2 text-sm text-gray-700">
          <input type="checkbox" [(ngModel)]="viaje.estado" class="rounded" />
          <span>Estado (completado)</span>
        </label>
      </div>
    </div>

    <div class="flex items-center justify-end gap-3 px-6 py-4 border-t">
      <button class="px-4 py-2 rounded-md bg-gray-100 text-gray-700" (click)="onCerrar()">Cancelar</button>
      <button class="px-4 py-2 rounded-md bg-pink-500 text-white" (click)="onGuardar()">Guardar</button>
    </div>
  </div>
</div>
