<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40" (click)="onCerrar()">
  <div class="bg-white rounded-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-xl" (click)="$event.stopPropagation()">
    <div class="p-6">
      <h2 class="text-2xl font-bold text-pink-600 mb-4">{{ actividad ? 'Editar' : 'Agregar' }} Actividad 🎯</h2>

      <div class="space-y-4">
        <!-- Nombre -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nombre *</label>
          <input
            type="text"
            [(ngModel)]="formulario.nombre"
            name="nombre"
            placeholder="Ej: Visita a la Torre Eiffel"
            required
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-500"
          />
          <p *ngIf="mostrarErrores && !formulario.nombre.trim()" class="text-sm text-red-600 mt-1">El nombre es obligatorio.</p>
        </div>

        <!-- Descripción -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
          <textarea
            [(ngModel)]="formulario.descripcion"
            placeholder="Detalles de la actividad..."
            rows="3"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-500"
          ></textarea>
        </div>

        <!-- Fecha y hora -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Fecha*</label>
            <input
              type="date"
              [(ngModel)]="formulario.fecha"
              name="fecha"
              required
              [min]="fechaMinima"
              class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-500"
            />
            <p *ngIf="mostrarErrores && !(formulario.fecha ?? '').trim()" class="text-sm text-red-600 mt-1">La fecha es obligatoria.</p>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Hora*</label>
            <input
              type="time"
              [(ngModel)]="formulario.hora"
              name="hora"
              required
              class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-500"
            />
            <p *ngIf="mostrarErrores && !(formulario.hora ?? '').trim()" class="text-sm text-red-600 mt-1">La hora es obligatoria.</p>
          </div>
        </div>

        <!-- Ubicación -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Ubicación</label>
          <input
            type="text"
            [(ngModel)]="formulario.ubicacion"
            placeholder="Ej: Champ de Mars, París"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-500"
          />
        </div>

        <!-- Precio y Prioridad -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Precio ($)</label>
            <input
              type="number"
              [(ngModel)]="formulario.precio"
              placeholder="Ej: 25"
              step="0.01"
              class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-500"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Prioridad</label>
            <select
              [(ngModel)]="formulario.prioridad"
              class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-500"
            >
              <option *ngFor="let prioridad of prioridades" [value]="prioridad">{{ prioridad }}</option>
            </select>
          </div>
        </div>

        <!-- Completada -->
        <div class="flex items-center gap-2">
          <input
            type="checkbox"
            [(ngModel)]="formulario.completada"
            id="completada"
            class="w-4 h-4 text-pink-600 focus:ring-pink-500 border-gray-300 rounded"
          />
          <label for="completada" class="text-sm font-medium text-gray-700">Actividad completada</label>
        </div>
      </div>

      <!-- Botones -->
      <div class="flex gap-3 mt-6">
        <button
          (click)="onGuardar()"
          class="flex-1 bg-gradient-to-br from-pink-400 to-pink-600 text-white py-2 rounded-md hover:from-pink-500 hover:to-pink-700 transition"
        >
          Guardar
        </button>
        <button
          (click)="onCerrar()"
          class="flex-1 bg-gray-300 text-gray-700 py-2 rounded-md hover:bg-gray-400 transition"
        >
          Cancelar
        </button>
      </div>
    </div>
  </div>
</div>
