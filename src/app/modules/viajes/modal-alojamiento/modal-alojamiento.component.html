<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40" (click)="onCerrar()">
  <div class="bg-white rounded-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-xl" (click)="$event.stopPropagation()">
    <div class="p-6">
      <h2 class="text-2xl font-bold text-pink-600 mb-4">{{ alojamiento ? 'Editar' : 'Agregar' }} Alojamiento 🏨</h2>

      <div class="space-y-4">
        <!-- Nombre -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nombre *</label>
          <input
            type="text"
            [(ngModel)]="formulario.nombre"
            placeholder="Ej: Hotel Ritz"
            required
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-500"
          />
        </div>

        <!-- Tipo -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Tipo</label>
          <select
            [(ngModel)]="formulario.tipo"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-500"
          >
            <option *ngFor="let tipo of tiposAlojamiento" [value]="tipo">{{ tipo }}</option>
          </select>
        </div>

        <!-- Dirección -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Dirección</label>
          <input
            type="text"
            [(ngModel)]="formulario.direccion"
            placeholder="Ej: Calle Mayor 15, Madrid"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-500"
          />
        </div>

        <!-- Fechas de check-in y check-out -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Check-in *</label>
            <input
              type="date"
              [(ngModel)]="formulario.fecha_checkin"
              required
              class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-500"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Check-out *</label>
            <input
              type="date"
              [(ngModel)]="formulario.fecha_checkout"
              required
              class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-500"
            />
          </div>
        </div>

        <!-- Precio por noche -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Precio por noche ($)</label>
          <input
            type="number"
            [(ngModel)]="formulario.precio_noche"
            placeholder="Ej: 80"
            step="0.01"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-500"
          />
        </div>

        <!-- Notas -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Notas</label>
          <textarea
            [(ngModel)]="formulario.notas"
            placeholder="Información adicional..."
            rows="3"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-500"
          ></textarea>
        </div>
      </div>

      <!-- Botones -->
      <div class="flex gap-3 mt-6">
        <button
          (click)="onGuardar()"
          class="flex-1 bg-gradient-to-br from-pink-400 to-pink-600 text-white py-2 rounded-md hover:from-pink-500 hover:to-pink-700 transition"
        >
          Guardar
        </button>
        <button
          (click)="onCerrar()"
          class="flex-1 bg-gray-300 text-gray-700 py-2 rounded-md hover:bg-gray-400 transition"
        >
          Cancelar
        </button>
      </div>
    </div>
  </div>
</div>
