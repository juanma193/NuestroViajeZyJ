<div class="min-h-screen bg-gradient-to-b from-pink-50 via-purple-50 to-white py-10 px-6">
  <div class="max-w-4xl mx-auto">
    <div class="flex flex-col items-center text-center gap-4">
      <img
        src="/assets/onboarding/onboarding-principal.png"
        alt="Ilustración principal"
        class="w-full max-w-md drop-shadow-sm"
      />
      <h1 class="text-2xl md:text-3xl font-bold text-pink-600">Bienvenidos al onboarding de pareja</h1>
      <p class="text-gray-600">Crea una nueva pareja o únete con un código de invitación.</p>
    </div>

    <div class="mt-10 grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-white/90 border border-pink-100 rounded-2xl shadow-lg p-6 flex flex-col gap-4">
        <img
          src="/assets/onboarding/onboarding-nuevo.png"
          alt="Crear pareja"
          class="w-28 h-28 mx-auto"
        />
        <div class="text-center">
          <h2 class="text-lg font-semibold text-gray-800">Crear pareja</h2>
          <p class="text-sm text-gray-500">Genera un nuevo vínculo con un nombre.</p>
        </div>
        <input
          type="text"
          [(ngModel)]="nombrePareja"
          class="w-full border border-pink-200 rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-pink-300 bg-white"
          placeholder="Nombre de la pareja (opcional)"
          [disabled]="cargando"
        />
        <button
          class="w-full bg-gradient-to-r from-pink-400 to-fuchsia-500 text-white px-4 py-3 rounded-2xl shadow-sm hover:from-pink-500 hover:to-fuchsia-600 disabled:opacity-50 disabled:cursor-not-allowed"
          (click)="crearPareja()"
          [disabled]="cargando">
          Crear pareja
        </button>
      </div>

      <div class="bg-white/90 border border-purple-100 rounded-2xl shadow-lg p-6 flex flex-col gap-4">
        <img
          src="/assets/onboarding/onboarding-unirse.png"
          alt="Unirse a pareja"
          class="w-28 h-28 mx-auto"
        />
        <div class="text-center">
          <h2 class="text-lg font-semibold text-gray-800">Unirse a pareja</h2>
          <p class="text-sm text-gray-500">Ingresa el código de invitación.</p>
        </div>
        <input
          type="text"
          [(ngModel)]="inviteCode"
          class="w-full border border-purple-200 rounded-2xl px-4 py-3 uppercase tracking-wider focus:outline-none focus:ring-2 focus:ring-purple-300 bg-white"
          placeholder="CÓDIGO"
          [disabled]="cargando"
        />
        <button
          class="w-full bg-gradient-to-r from-purple-400 to-indigo-500 text-white px-4 py-3 rounded-2xl shadow-sm hover:from-purple-500 hover:to-indigo-600 disabled:opacity-50 disabled:cursor-not-allowed"
          (click)="unirsePareja()"
          [disabled]="cargando">
          Unirme
        </button>
      </div>
    </div>

    <p *ngIf="error" class="mt-6 text-sm text-red-600 text-center">{{ error }}</p>
  </div>
</div>
