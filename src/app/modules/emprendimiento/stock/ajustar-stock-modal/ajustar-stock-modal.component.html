<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" (click)="onCerrar()">
  <div
    class="bg-white rounded-2xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto"
    (click)="$event.stopPropagation()"
  >
    <div class="sticky top-0 bg-gradient-to-r from-pink-500 to-rose-500 text-white p-6 rounded-t-2xl">
      <h2 class="text-2xl font-bold">📦 Ajustar stock</h2>
      <p class="text-sm text-white/90 mt-1">{{ material.nombre }}</p>
    </div>

    <div class="p-6 space-y-4">
      <div class="bg-gray-50 rounded-xl p-4 border border-gray-100">
        <div class="text-xs font-semibold text-gray-600">Stock actual</div>
        <div class="text-lg font-extrabold text-gray-900">
          {{ stockActual }} {{ material.unidad_base }}
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Tipo de movimiento *</label>
        <select
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent"
          [(ngModel)]="tipoMovimiento"
        >
          <option *ngFor="let t of tipos" [ngValue]="t.value">{{ t.label }}</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">{{ labelCantidad }} *</label>
        <div class="flex items-center gap-2">
          <input
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent"
            [(ngModel)]="cantidad"
            appNonNegativeNumber
            type="number"
            min="0"
            step="0.01"
          />
          <div class="text-sm font-extrabold text-gray-700 shrink-0">{{ material.unidad_base }}</div>
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Motivo *</label>
        <input
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent"
          [(ngModel)]="motivo"
          placeholder="Ej: Compra manual, Uso manual, Ajuste inventario"
          type="text"
        />
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Observaciones</label>
        <textarea
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent resize-none"
          [(ngModel)]="observaciones"
          rows="3"
          placeholder="Opcional"
        ></textarea>
      </div>

      <div class="bg-amber-50 rounded-xl p-4 border border-amber-100">
        <div class="text-xs font-semibold text-gray-600">Stock resultante</div>
        <div class="text-lg font-extrabold" [ngClass]="stockNuevoPreview < 0 ? 'text-rose-700' : 'text-gray-900'">
          {{ stockNuevoPreview }} {{ material.unidad_base }}
        </div>
        <div *ngIf="stockNuevoPreview < 0" class="text-xs font-semibold text-rose-700 mt-1">
          Stock insuficiente
        </div>
      </div>
    </div>

    <div class="sticky bottom-0 bg-gray-50 p-6 rounded-b-2xl flex gap-3">
      <button
        type="button"
        (click)="onCerrar()"
        class="flex-1 px-4 py-3 border border-gray-300 text-gray-700 rounded-lg font-semibold hover:bg-gray-100 transition-colors"
        [disabled]="guardando"
      >
        Cancelar
      </button>
      <button
        type="button"
        (click)="onGuardar()"
        class="flex-1 px-4 py-3 bg-gradient-to-r from-pink-500 to-rose-500 text-white rounded-lg font-semibold hover:shadow-lg transition-all disabled:opacity-50"
        [disabled]="guardando"
      >
        {{ guardando ? 'Guardando...' : 'Confirmar movimiento' }}
      </button>
    </div>
  </div>
</div>
