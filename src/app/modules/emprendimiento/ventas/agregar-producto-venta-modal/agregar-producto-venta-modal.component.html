<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" (click)="onCerrar()">
  <div
    class="bg-white rounded-2xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto"
    (click)="$event.stopPropagation()"
  >
    <div class="sticky top-0 bg-gradient-to-r from-pink-500 to-rose-500 text-white p-6 rounded-t-2xl">
      <h2 class="text-2xl font-bold">Agregar producto</h2>
      <p class="text-sm text-white/90 mt-1">{{ venta.cliente_nombre || 'Cliente sin nombre' }}</p>
    </div>

    <div class="p-6 space-y-4">
      <div *ngIf="cargando" class="text-center text-gray-600 font-semibold py-8">Cargando...</div>

      <ng-container *ngIf="!cargando">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Producto *</label>
          <select
            class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-pink-500 focus:border-transparent"
            [(ngModel)]="form.producto_id"
            (ngModelChange)="onProductoChange()"
          >
            <option [ngValue]="null">Seleccionar producto</option>
            <option *ngFor="let p of productos" [ngValue]="p.id">
              {{ p.nombre }}
            </option>
          </select>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Cantidad *</label>
            <input
              class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-pink-500 focus:border-transparent"
              [(ngModel)]="form.cantidad"
              appNonNegativeNumber
              type="number"
              min="0"
              step="1"
            />
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Precio unitario *</label>
            <input
              class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-pink-500 focus:border-transparent"
              [(ngModel)]="form.precio_unitario"
              appNonNegativeNumber
              type="number"
              min="0"
              step="0.01"
            />
          </div>
        </div>

        <div *ngIf="lineaPreview as linea" class="grid grid-cols-1 sm:grid-cols-3 gap-2">
          <div class="bg-amber-50 border border-amber-100 rounded-xl p-3">
            <div class="text-xs font-semibold text-gray-600">Precio total</div>
            <div class="font-extrabold text-gray-900">{{ formatMoney(linea.precio_total) }}</div>
          </div>
          <div class="bg-rose-50 border border-rose-100 rounded-xl p-3">
            <div class="text-xs font-semibold text-gray-600">Costo total</div>
            <div class="font-extrabold text-gray-900">{{ formatMoney(linea.costo_total) }}</div>
          </div>
          <div class="bg-green-50 border border-green-100 rounded-xl p-3">
            <div class="text-xs font-semibold text-gray-600">Ganancia</div>
            <div class="font-extrabold text-gray-900">{{ formatMoney(linea.ganancia) }}</div>
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Observaciones</label>
          <textarea
            class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-pink-500 focus:border-transparent resize-none"
            [(ngModel)]="form.observaciones"
            rows="3"
          ></textarea>
        </div>
      </ng-container>
    </div>

    <div class="sticky bottom-0 bg-gray-50 p-6 rounded-b-2xl flex gap-3">
      <button
        type="button"
        (click)="onCerrar()"
        class="flex-1 px-4 py-3 border border-gray-300 text-gray-700 rounded-xl font-semibold hover:bg-gray-100 transition-colors"
        [disabled]="guardando"
      >
        Cancelar
      </button>
      <button
        type="button"
        (click)="guardar()"
        class="flex-1 px-4 py-3 bg-gradient-to-r from-pink-500 to-rose-500 text-white rounded-xl font-semibold hover:shadow-lg transition-all disabled:opacity-50"
        [disabled]="guardando || cargando"
      >
        {{ guardando ? 'Guardando...' : 'Agregar producto' }}
      </button>
    </div>
  </div>
</div>
