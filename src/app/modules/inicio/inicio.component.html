<div class="max-w-6xl mx-auto p-6">
  <section class="relative overflow-hidden rounded-3xl shadow-xl" aria-label="Carrusel de recuerdos">
    <img
      class="w-full h-72 sm:h-96 md:h-[32rem] object-cover relative z-0"
      [src]="currentPhoto?.src"
      [alt]="currentPhoto?.alt || 'Foto destacada'"
      loading="lazy"
      decoding="async"
    />
    <button
      type="button"
      class="absolute left-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/80 text-pink-600 shadow-lg hover:bg-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-pink-400 z-10"
      (click)="prevPhoto()"
      aria-label="Foto anterior"
    >
      <span aria-hidden="true">‹</span>
    </button>
    <button
      type="button"
      class="absolute right-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/80 text-pink-600 shadow-lg hover:bg-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-pink-400 z-10"
      (click)="nextPhoto()"
      aria-label="Siguiente foto"
    >
      <span aria-hidden="true">›</span>
    </button>
    <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-black/25 to-transparent z-0 pointer-events-none"></div>
    <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-6 z-10 pointer-events-none">
      <h2 class="text-2xl sm:text-3xl md:text-4xl font-bold text-white drop-shadow">Nuestros recuerdos favoritos, un día a la vez 💕</h2>
      <p class="mt-3 text-white/90">{{ fraseAleatoria }}</p>
    </div>
  </section>

  <div class="flex items-center gap-3 my-8" aria-hidden="true">
    <div class="h-px flex-1 bg-gradient-to-r from-transparent via-pink-300 to-transparent"></div>
    <span class="text-pink-400">❤</span>
    <div class="h-px flex-1 bg-gradient-to-r from-transparent via-pink-300 to-transparent"></div>
  </div>

  <section aria-label="Mural de fotos">
    <h3 class="text-xl font-semibold text-pink-600 mb-4">Momentos en imágenes</h3>
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
      <figure class="group relative aspect-square overflow-hidden rounded-xl" *ngFor="let photo of photos">
        <img
          class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
          [src]="photo.src"
          [alt]="photo.alt"
          loading="lazy"
          decoding="async"
        />
        <div class="absolute inset-0 bg-black/0 group-hover:bg-black/25 transition-colors duration-300"></div>
        <figcaption class="absolute bottom-2 left-2 right-2 text-xs text-white/0 group-hover:text-white/90 transition-colors duration-300 drop-shadow">
          {{ photo.caption }}
        </figcaption>
        <div class="absolute inset-0 shadow-[inset_0_0_0_1px_rgba(255,255,255,0.15)]"></div>
      </figure>
    </div>
  </section>
</div>
