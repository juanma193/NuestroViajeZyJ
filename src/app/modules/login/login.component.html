<div class="min-h-screen relative overflow-hidden bg-gradient-to-b from-pink-200 via-pink-100 to-amber-50 flex items-center justify-center px-6 py-10">
  <!-- estrellitas sutiles (más lindas) -->
  <div class="pointer-events-none absolute inset-0 opacity-25">
    <div class="absolute top-14 left-10 h-1.5 w-1.5 rounded-full bg-white"></div>
    <div class="absolute top-28 right-10 h-1 w-1 rounded-full bg-white"></div>
    <div class="absolute top-40 left-28 h-1 w-1 rounded-full bg-white"></div>
    <div class="absolute top-20 right-28 h-1.5 w-1.5 rounded-full bg-white"></div>
    <div class="absolute top-56 left-14 h-1 w-1 rounded-full bg-white"></div>
    <div class="absolute bottom-28 left-12 h-1.5 w-1.5 rounded-full bg-white"></div>
    <div class="absolute bottom-20 right-14 h-1 w-1 rounded-full bg-white"></div>
    <div class="absolute bottom-40 right-28 h-1.5 w-1.5 rounded-full bg-white"></div>
  </div>

  <!-- glows (más dreamy) -->
  <div class="pointer-events-none absolute -top-24 left-1/2 -translate-x-1/2 h-[520px] w-[520px] rounded-full bg-white/45 blur-3xl"></div>
  <div class="pointer-events-none absolute -bottom-32 left-1/2 -translate-x-1/2 h-[520px] w-[520px] rounded-full bg-pink-200/35 blur-3xl"></div>

  <!-- overlay suave para unificar -->
  <div class="pointer-events-none absolute inset-0 bg-gradient-to-b from-white/10 via-transparent to-white/10"></div>

  <!-- contenido -->
  <div class="relative w-full max-w-sm text-center">
    <h1 class="text-[28px] leading-tight font-semibold tracking-tight text-pink-500">
      Nuestro Viaje
    </h1>
    <p class="text-sm text-gray-600 mt-1.5">
      Compartí recuerdos y planes juntos
    </p>

    <!-- ilustración -->
    <div class="mt-6 mb-6 flex justify-center">
      <img
        src="/assets/login-imagen.png"
        alt="Ilustración pareja"
        class="w-[340px] max-w-full drop-shadow-[0_16px_40px_rgba(236,72,153,0.18)]"
      />
    </div>

    <!-- CTA -->
    <button
      class="w-full bg-white/60 backdrop-blur-md border border-white/70 text-gray-700 rounded-full px-4 py-3.5
             flex items-center justify-center gap-2 shadow-[0_10px_30px_rgba(236,72,153,0.12)]
             hover:bg-white/75 transition disabled:opacity-50 disabled:cursor-not-allowed"
      (click)="loginGoogle()"
      [disabled]="cargando"
    >
      <svg class="w-4 h-4 text-pink-500" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 21s-7.5-4.6-9.5-8.6A5.5 5.5 0 0112 6a5.5 5.5 0 019.5 6.4C19.5 16.4 12 21 12 21z" />
      </svg>
      <span class="font-medium">Continuar con Google</span>
    </button>

    <!-- línea seguridad (chips suaves) -->
    <div class="mt-5 flex items-center justify-center gap-2 text-[11px] text-gray-600">
      <span class="flex items-center gap-1 rounded-full bg-white/50 border border-white/60 px-2.5 py-1">
        <span class="text-amber-600">🔒</span> Seguro
      </span>
      <span class="flex items-center gap-1 rounded-full bg-white/50 border border-white/60 px-2.5 py-1">
        <span class="text-pink-500">♡</span> Privado
      </span>
      <span class="flex items-center gap-1 rounded-full bg-white/50 border border-white/60 px-2.5 py-1">
        <span class="text-pink-500">♡</span> De a dos
      </span>
    </div>
  </div>
</div>
