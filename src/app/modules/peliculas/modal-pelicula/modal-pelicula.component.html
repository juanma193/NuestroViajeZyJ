<div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4" (click)="onCerrar()">
  <div class="bg-white w-full max-w-lg rounded-xl shadow-2xl overflow-hidden" (click)="$event.stopPropagation()">
    <div class="flex items-center justify-between px-6 py-4 border-b">
      <h2 class="text-xl font-bold">🎬 Agregar Nueva Película</h2>
      <button class="text-gray-500 hover:text-gray-700" (click)="onCerrar()">✕</button>
    </div>

    <div class="p-6 space-y-4">
      <div>
        <label for="nombre" class="block text-sm font-medium text-gray-700">Nombre de la película *</label>
        <input type="text" id="nombre" [(ngModel)]="pelicula.nombre" placeholder="Ej: Inception" required class="mt-1 block w-full rounded-md border-gray-200 shadow-sm px-3 py-2 focus:ring-pink-300 focus:border-pink-300" />
      </div>

      <div>
        <label for="fecha_estreno" class="block text-sm font-medium text-gray-700">Año de estreno</label>
        <input type="text" id="fecha_estreno" [(ngModel)]="pelicula.fecha_estreno" placeholder="Ej: 2010" class="mt-1 block w-full rounded-md border-gray-200 shadow-sm px-3 py-2 focus:ring-pink-300 focus:border-pink-300" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Puntuación</label>
        <div class="flex items-center gap-4 mt-2">
          <div class="flex gap-1 text-2xl">
            <span *ngFor="let estrella of getEstrellas(); let i = index" (click)="setValoracion(i + 1)" class="cursor-pointer" [ngClass]="{ 'text-yellow-400': estrella === '★', 'text-gray-300': estrella !== '★' }">{{ estrella }}</span>
          </div>

          <label class="inline-flex items-center gap-2 text-sm text-gray-700">
            <input type="checkbox" [(ngModel)]="pelicula.visto" class="rounded" />
            <span>Vista</span>
          </label>
        </div>
      </div>

      <div>
        <label for="comentario" class="block text-sm font-medium text-gray-700">Comentarios</label>
        <textarea id="comentario" [(ngModel)]="pelicula.comentario" placeholder="Tus notas sobre la película..." rows="3" class="mt-1 block w-full rounded-md border-gray-200 shadow-sm px-3 py-2 focus:ring-pink-300 focus:border-pink-300"></textarea>
      </div>
    </div>

    <div class="flex items-center justify-end gap-3 px-6 py-4 border-t">
      <button class="px-4 py-2 rounded-md bg-gray-100 text-gray-700" (click)="onCerrar()">Cancelar</button>
      <button class="px-4 py-2 rounded-md bg-pink-500 text-white disabled:opacity-50" (click)="onGuardar()" [disabled]="!pelicula.nombre.trim()">Guardar</button>
    </div>
  </div>
</div>
