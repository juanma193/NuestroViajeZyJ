<div class="modal-overlay" (click)="onCerrar()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>🎬 Agregar Nueva Película</h2>
      <button class="btn-close" (click)="onCerrar()">✕</button>
    </div>

    <div class="modal-body">
      <div class="form-group">
        <label for="nombre">Nombre de la película *</label>
        <input 
          type="text" 
          id="nombre"
          [(ngModel)]="pelicula.nombre"
          placeholder="Ej: Inception"
          class="form-control"
          required>
      </div>

      <div class="form-group">
        <label for="fecha_estreno">Año de estreno</label>
        <input 
          type="text" 
          id="fecha_estreno"
          [(ngModel)]="pelicula.fecha_estreno"
          placeholder="Ej: 2010"
          class="form-control">
      </div>

      <div class="form-group">
        <label>Puntuación</label>
        <div class="valoracion-selector">
          <span *ngFor="let estrella of getEstrellas(); let i = index"
                class="estrella"
                [class.llena]="estrella === '★'"
                (click)="setValoracion(i + 1)">
            {{ estrella }}
          </span>
        </div>
      </div>

      <div class="form-group">
        <label for="comentario">Comentarios</label>
        <textarea 
          id="comentario"
          [(ngModel)]="pelicula.comentario"
          placeholder="Tus notas sobre la película..."
          class="form-control"
          rows="3"></textarea>
      </div>

      <div class="form-group">
        <label class="checkbox-label">
          <input 
            type="checkbox" 
            [(ngModel)]="pelicula.visto">
          <span>Ya la vi</span>
        </label>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" (click)="onCerrar()">Cancelar</button>
      <button 
        class="btn-save" 
        (click)="onGuardar()"
        [disabled]="!pelicula.nombre.trim()">
        Guardar
      </button>
    </div>
  </div>
</div>
