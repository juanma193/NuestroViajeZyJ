<div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4" (click)="onCancelar()">
  <div class="bg-white w-full max-w-sm rounded-xl shadow-lg" (click)="$event.stopPropagation()">
    <div class="px-6 py-4 border-b">
      <h3 class="text-lg font-semibold">{{ titulo }}</h3>
    </div>
    <div class="p-6">
      <p class="text-gray-700">{{ mensaje }}</p>
    </div>
    <div class="flex justify-end gap-3 px-6 py-4 border-t">
      <button class="px-3 py-2 rounded-md bg-gray-100 text-gray-700" (click)="onCancelar()">Cancelar</button>
      <button class="px-3 py-2 rounded-md bg-red-500 text-white" (click)="onConfirmar()">Eliminar</button>
    </div>
  </div>
</div>
