<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" (click)="onCerrar()">
  <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto" (click)="$event.stopPropagation()">
    <div class="sticky top-0 bg-gradient-to-r from-pink-500 to-rose-500 text-white p-6 rounded-t-2xl">
      <h2 class="text-2xl font-bold">{{ lugarEditar ? '✏️ Editar Lugar' : '➕ Agregar Lugar' }}</h2>
    </div>

    <div class="p-6 space-y-4">
      <!-- Nombre -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Nombre del lugar *</label>
        <input
          type="text"
          [(ngModel)]="lugar.nombre"
          placeholder="Ej: Torre Eiffel"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent"
        />
      </div>

      <!-- Ubicación -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Ubicación / País *</label>
        <input
          type="text"
          [(ngModel)]="lugar.ubicacion"
          placeholder="Ej: París, Francia"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent"
        />
      </div>

      <!-- Descripción -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Descripción (opcional)</label>
        <textarea
          [(ngModel)]="lugar.descripcion"
          placeholder="Describe qué te gustaría hacer o ver en este lugar..."
          rows="3"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent resize-none"
        ></textarea>
      </div>

      <!-- Categoría -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Categoría *</label>
        <input
          type="text"
          [(ngModel)]="lugar.categoria"
          placeholder="Escribe o selecciona una categoría"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent mb-3"
        />
        
        <div class="flex flex-wrap gap-2">
          <button
            *ngFor="let cat of categoriasSugeridas"
            type="button"
            (click)="seleccionarCategoria(cat)"
            [ngClass]="{ 'bg-pink-500 text-white': lugar.categoria === cat, 'bg-gray-100 text-gray-700': lugar.categoria !== cat }"
            class="px-3 py-1 rounded-full text-sm font-medium transition-colors hover:bg-pink-400 hover:text-white"
          >
            {{ cat }}
          </button>
        </div>
      </div>

      <!-- Visitado -->
      <div class="flex items-center gap-3 p-3 bg-gray-50 rounded-lg">
        <input
          type="checkbox"
          id="visitado"
          [(ngModel)]="lugar.visitado"
          class="w-5 h-5 text-pink-500 rounded focus:ring-pink-500"
        />
        <label for="visitado" class="text-sm font-medium text-gray-700 cursor-pointer">
          Ya visitamos este lugar
        </label>
      </div>
    </div>

    <!-- Botones -->
    <div class="sticky bottom-0 bg-gray-50 p-6 rounded-b-2xl flex gap-3">
      <button
        type="button"
        (click)="onCerrar()"
        class="flex-1 px-4 py-3 border border-gray-300 text-gray-700 rounded-lg font-semibold hover:bg-gray-100 transition-colors"
      >
        Cancelar
      </button>
      <button
        type="button"
        (click)="onGuardar()"
        class="flex-1 px-4 py-3 bg-gradient-to-r from-pink-500 to-rose-500 text-white rounded-lg font-semibold hover:shadow-lg transition-all"
      >
        Guardar
      </button>
    </div>
  </div>
</div>
