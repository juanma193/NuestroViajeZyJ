<div class="max-w-2xl mx-auto p-6">
  <h1 class="text-2xl font-bold text-pink-600">Perfil</h1>
  <p class="text-gray-600 mb-6">Tu información de usuario</p>

  <div *ngIf="cargando" class="fixed inset-0 z-50 flex items-center justify-center bg-black/30">
    <div class="flex flex-col items-center gap-4">
      <svg class="w-14 h-14 text-pink-500 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
      </svg>
      <span class="text-white font-semibold">Cargando...</span>
    </div>
  </div>

  <div *ngIf="!cargando" class="bg-white rounded-xl border p-6 shadow">
    <div class="flex items-center gap-4 mb-6">
      <img
        *ngIf="perfil.avatar_url"
        [src]="perfil.avatar_url"
        alt="Avatar"
        class="w-16 h-16 rounded-full object-cover border"
      />
      <div>
        <p class="text-sm text-gray-500">Email</p>
        <p class="font-medium">{{ email }}</p>
      </div>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
        <input
          type="text"
          [(ngModel)]="perfil.nombre"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-500"
          placeholder="Tu nombre"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Avatar URL</label>
        <input
          type="text"
          [(ngModel)]="perfil.avatar_url"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-500"
          placeholder="https://..."
        />
      </div>
    </div>

    <button
      class="mt-6 bg-gradient-to-br from-pink-400 to-pink-600 text-white px-4 py-2 rounded-md hover:from-pink-500 hover:to-pink-700 disabled:opacity-50 disabled:cursor-not-allowed"
      (click)="guardarPerfil()"
      [disabled]="guardando">
      Guardar
    </button>
  </div>
</div>
