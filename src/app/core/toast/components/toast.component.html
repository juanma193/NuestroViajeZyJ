<div class="fixed z-[1000] bottom-8 left-1/2 transform -translate-x-1/2 w-auto px-4">
  <div class="inline-flex items-center gap-4 shadow-lg rounded-full bg-white px-6 py-2 max-w-[900px] min-w-[240px]">
    <i class="bi text-lg" [class]="typeClass" aria-hidden="true"></i>

    <div class="flex-1 text-sm text-gray-700">{{ message }}</div>

    <button (click)="close()" class="ml-4 text-gray-500 hover:text-gray-800">
      <i class="bi bi-x"></i>
    </button>
  </div>
</div>
